# Model prices for the sessions people drive (docs/session-cost-plan.md S3), in USD per
# million tokens. Runner steps don't use these: they keep their own basis (a cost plugin,
# a profile's price, else the harness's figure).
#
# Anthropic first-party list prices, from the claude-api reference on 2026-11-10. Cache
# writes are 1.25x input for 5 minutes (cache_write) and 2x for an hour
# (cache_write_1h); cache reads are 0.1x input unless the model's rate differs.
# Sessions on a gateway with other rates, and Codex models (none here), are priced
# from [prices."<glob>"] tables in config.toml, which are checked first.
#
# The first table whose glob matches the session's model wins, so specific globs go
# before broad ones.

[prices."claude-fable-5-1*"]
input = 10.0
output = 50.0
cache_write = 12.5
cache_write_1h = 20.0
cache_read = 0.25

[prices."claude-mythos-5-1*"]
input = 10.0
output = 50.0
cache_write = 12.5
cache_write_1h = 20.0
cache_read = 0.25

[prices."claude-fable-5*"]
input = 10.0
output = 50.0
cache_write = 12.5
cache_write_1h = 20.0
cache_read = 1.0

[prices."claude-opus-5-5*"]
input = 4.0
output = 20.0
cache_write = 5.0
cache_write_1h = 8.0
cache_read = 0.2

[prices."claude-opus-5*"]
input = 5.0
output = 25.0
cache_write = 6.25
cache_write_1h = 10.0
cache_read = 0.5

[prices."claude-opus-4-[678]*"]
input = 5.0
output = 25.0
cache_write = 6.25
cache_write_1h = 10.0
cache_read = 0.5

[prices."claude-sonnet-5*"]
input = 2.0
output = 10.0
cache_write = 2.5
cache_write_1h = 4.0
cache_read = 0.2

[prices."claude-sonnet-4-6*"]
input = 3.0
output = 15.0
cache_write = 3.75
cache_write_1h = 6.0
cache_read = 0.3

[prices."claude-haiku-4-5*"]
input = 1.0
output = 5.0
cache_write = 1.25
cache_write_1h = 2.0
cache_read = 0.1
