[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "work-packet"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml >= 6",
    "tomli >= 2; python_version < '3.11'",
    "tomli-w >= 1",
]
authors = [
    {name="Matthew Ballance"},
]
description = "Agents as processes: resumable LLM work packets with durable state on disk"
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dash = [
    "starlette >= 0.37",
    "jinja2 >= 3.1",
    "uvicorn >= 0.29",
    "websockets >= 12",           # the browser shell (docs/dash-tasks.md §5)
    "python-multipart >= 0.0.9",  # Compose's file upload
    "httpx >= 0.27",              # web VS Code's proxy (docs/vscode-plan.md §4.1)
]
tui = [
    "textual >= 0.80",
    "pyte >= 0.8",
]

[project.scripts]
wpk = "work_packet.cli:main"

[project.urls]
Source = "https://github.com/work-packet/work-packet"

[tool.setuptools.dynamic]
version = {attr = "work_packet.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
work_packet = ["prompts/*.md", "dash/templates/*.html", "dash/live.js", "dash/pane.js", "dash/compose.js", "dash/shell.js", "dash/new.js", "dash/ide.js", "dash/vendor/*", "profiles.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real claude CLI (skipped unless WPK_LIVE=1)"]
